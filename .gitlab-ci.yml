# Pipeline de GitLab. Espejo de .github/workflows/ci.yml (el repositorio nació en GitHub y se
# movió a GitLab sin traer el CI: docs/AUDITORIA_INGENIERIA.md, hallazgo A1). YAML validado con la
# API ci/lint del proyecto.
#
# Coste, medido el 2026-09-16 en runners compartidos: lint ~1 min, unitarias completas en 3 shards
# ~4 + 11 + 12 min, build 1 min, cobertura 1 min, E2E ~15 min: unos 43 minutos de runner por
# pipeline. Con un pipeline por MR y otro por merge a main se agotaron los 400 minutos mensuales del
# plan gratuito en una tarde. Por eso hay dos perfiles:
#   - MR: lint + tipos + formato, suite rápida, build y presupuesto de bundle (~5 min), y la equivalencia
#     CPU/GPU del caso normal sobre ese build (13 pruebas, ~3 min en el runner propio), porque el espejo GLSL del
#     clasificador está escrito a mano y ninguna prueba unitaria compara sus números con los de la CPU (decisión 154).
#   - main (y tags): lo anterior más la suite completa con cobertura en shards y los E2E sobre dist/.
# Con un runner propio (gitlab-runner en una máquina del equipo) los dos perfiles pueden igualarse.
# Los E2E corren sobre `dist/` con SwiftShader; `gpu-live.spec.ts` se salta sin GPU por hardware.

stages: [verify, test, build, e2e]

default:
  image: node:22
  interruptible: true
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.full-only:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

lint:
  stage: verify
  script:
    - npm run lint
    - npm run typecheck
    - npm run format:check

unit-fast:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - npm test

unit:
  extends: .full-only
  stage: test
  parallel: 3
  script:
    # Cada shard emite un informe blob; `coverage` los funde y aplica los umbrales una sola vez
    # (VITEST_COVERAGE_SHARD desactiva los pisos por área en el shard: vite.config.ts).
    - VITEST_TIER=all VITEST_COVERAGE_SHARD=1 npx vitest run --coverage --coverage.reporter=none --reporter=blob --reporter=default --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL
  artifacts:
    when: always
    paths: [.vitest-reports/]
    expire_in: 1 week

coverage:
  extends: .full-only
  stage: build
  needs: [unit]
  script:
    - npx vitest run --merge-reports --coverage
    - |
      node -e '
        const t = require("./coverage/coverage-summary.json").total;
        for (const k of ["lines", "statements", "functions", "branches"])
          console.log(k + ": " + t[k].pct + "% (" + t[k].covered + "/" + t[k].total + ")");
      '
  coverage: '/^lines: (\d+\.?\d*)%/'
  artifacts:
    when: always
    paths: [coverage/]
    expire_in: 1 week

build:
  stage: build
  needs: []
  script:
    - npx vite build
    - node tools/ci/bundle-budget.mjs
  artifacts:
    paths: [dist/]
    expire_in: 1 week

e2e:
  extends: .full-only
  stage: e2e
  needs: [build]
  # La imagen trae Chromium y sus dependencias del sistema; la versión debe coincidir con
  # @playwright/test en package.json.
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  variables:
    CI: 'true'
    # el runner es un Mac compartido: antes de la primera prueba, e2e/globalSetup.ts espera (hasta estos minutos)
    # a que la carga baje, porque a carga 300+ toda la suite cae en su primer cuadro sin fallo de código
    E2E_LOAD_WAIT_MIN: '10'
  script:
    # En el runner propio (shell), un trabajo cancelado deja vivo su `vite preview` y el puerto 4173 ocupado; el
    # siguiente E2E falla sin probar nada. Solo se detienen las vistas previas lanzadas desde este checkout.
    - pkill -f "$CI_PROJECT_DIR/node_modules/.bin/vite preview" || true
    - npm run test:e2e
  artifacts:
    when: on_failure
    paths: [playwright-report/, test-results/]
    expire_in: 1 week

# La equivalencia CPU/GPU del caso normal, antes del merge (decisión 154): hasta entonces solo corría en main, después
# del merge, y una diferencia entre el clasificador de CPU y su espejo GLSL escrito a mano llegaba a main sin aviso.
e2e-gpu:
  stage: e2e
  needs: [build]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  variables:
    CI: 'true'
    E2E_LOAD_WAIT_MIN: '10'
  script:
    - pkill -f "$CI_PROJECT_DIR/node_modules/.bin/vite preview" || true
    - npx playwright test e2e/gpu-equivalence.spec.ts --grep normal-excellent-window
  artifacts:
    when: on_failure
    paths: [playwright-report/, test-results/]
    expire_in: 1 week
