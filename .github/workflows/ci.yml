# CI en GitHub Actions (decisión 211).
#
# Un solo perfil para los PR y para `main`: en un repositorio público los runners alojados no descuentan minutos, así que
# no hace falta una suite rápida aparte para los PR. Corre lint, formato y tipos, la suite completa con cobertura en
# cuatro shards (decisión 239), el build con su presupuesto de bundle y los E2E sobre `dist/` (Chromium con SwiftShader;
# `gpu-live.spec.ts` se salta sin GPU por hardware, `gpu-equivalence.spec.ts` sí corre).
# La protección de `main` exige el check `check`, que resume los demás trabajos.
#
# Cadena de suministro (decisión 305): cada acción va fijada por el SHA de su commit, con la versión en un comentario
# (una etiqueta se puede mover; un SHA no); Dependabot propone cada semana las subidas de las acciones y de npm
# (`.github/dependabot.yml`); el checkout no deja el token en `.git/config`; y `lint` falla si las dependencias de
# producción tienen una vulnerabilidad conocida alta o crítica (`npm audit --omit=dev`).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Vulnerabilidades conocidas en las dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Cada shard emite un informe blob; `coverage` los funde y aplica los umbrales una sola vez
      # (VITEST_COVERAGE_SHARD desactiva los pisos por área en el shard: vite.config.ts).
      - name: Suite completa (shard ${{ matrix.shard }}/4)
        run: VITEST_TIER=all VITEST_COVERAGE_SHARD=1 npx vitest run --coverage --coverage.reporter=none --reporter=blob --reporter=default --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: blob-${{ matrix.shard }}
          path: .vitest-reports/
          # upload-artifact@v4 omite los directorios que empiezan por punto si no se le pide
          include-hidden-files: true
          if-no-files-found: error
  coverage:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Funde los shards y aplica los umbrales de cobertura
        run: VITEST_TIER=all npx vitest run --merge-reports --coverage
      - name: Resumen de cobertura
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("coverage/coverage-summary.json")) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "No se generó el resumen de cobertura.\n");
              process.exit(0);
            }
            const total = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "statements", "functions", "branches"]
              .map((k) => `| ${k} | ${total[k].pct}% | ${total[k].covered}/${total[k].total} |`)
              .join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Cobertura\n\n| Métrica | % | Cubierto/Total |\n|---|---|---|\n${rows}\n`);
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # tipos, vite build y el presupuesto de bundle (tools/ci/bundle-budget.mjs)
      - run: npm run build
      # coste del trazador CPU frente a su línea base (decisión 247): falla si crece más de un 25 %
      - name: Coste del trazador CPU
        run: npx tsx tools/ci/tracer-budget.ts
      # Los E2E manejan la app por window.__echotwin, que sólo instala la build de pruebas (src/main.tsx); la build de
      # producción de arriba se comprueba sin él en el presupuesto de bundle.
      - name: Build con el gancho de pruebas para los E2E
        run: npm run build:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # playwright.config.ts sirve la app construida con `vite preview`: necesita dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      # Publish individual failures as check annotations, independently of downloadable artifacts.
      - run: npm run test:e2e -- --reporter=list,github
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
  # La protección de `main` exige un check llamado «check»: resume los trabajos reales.
  fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Banco de fidelidad sintética y límites conocidos
        run: npm run fidelity:audit -- --out /tmp/echotwin-fidelity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fidelity-report
          path: /tmp/echotwin-fidelity.json
          if-no-files-found: error
  check:
    needs: [lint, coverage, build, e2e, fidelity]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resultado de cada trabajo
        run: echo '${{ toJSON(needs) }}'
      - name: Falla si alguno no terminó bien
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != "success" ]; then
              echo "Un trabajo exigido no terminó bien: $result"
              exit 1
            fi
          done
