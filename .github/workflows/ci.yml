name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Each shard collects raw coverage into a blob report; thresholds are checked once
      # by the coverage job on the merged result (VITEST_COVERAGE_SHARD, see vite.config.ts).
      - name: Run tests (shard ${{ matrix.shard }}/3)
        run: VITEST_TIER=all VITEST_COVERAGE_SHARD=1 npx vitest run --coverage --coverage.reporter=none --reporter=blob --reporter=default --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.shard }}
          path: .vitest-reports/
          # upload-artifact@v4 skips dot-directories unless told otherwise
          include-hidden-files: true
          if-no-files-found: error
  coverage:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Merge shard reports and check coverage thresholds
        run: npx vitest run --merge-reports --coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("coverage/coverage-summary.json")) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Coverage summary not generated.\n");
              return;
            }
            const total = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "statements", "functions", "branches"]
              .map((k) => `| ${k} | ${total[k].pct}% | ${total[k].covered}/${total[k].total} |`)
              .join("\n");
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `## Coverage summary\n\n| Metric | % | Covered/Total |\n|---|---|---|\n${rows}\n`,
            );
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # playwright.config.ts serves the built app via `vite preview`, so it needs dist/
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
  # Branch protection requires a status check named "check"; this gate aggregates the real jobs.
  check:
    needs: [lint, coverage, build, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report job results
        run: echo '${{ toJSON(needs) }}'
      - name: Fail unless every job succeeded
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != "success" ]; then
              echo "Required job did not succeed: $result"
              exit 1
            fi
          done
